
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcontext"
version = "0.1.0"
description = "End-to-End Codebase Intelligence and Developer Copilot"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer",
    "rich",
    "gitpython",
    "rank-bm25",
    "fastapi",
    "uvicorn[standard]",
    "tree-sitter<0.26",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "qdrant-client",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
gitcontext = "gitcontext.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitcontext = ["static/*.html", "static/*.css", "static/*.js", "static/fonts/*.woff2", "static/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
